<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acil Sağlık Kimliği</title>
    <style>
        /* TASARIM KISMI */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { background: white; max-width: 400px; margin: auto; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #dc3545; color: white; padding: 20px; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; margin-top: -60px; background: #ddd; object-fit: cover;}
        .content { padding: 20px; }
        h1 { margin: 10px 0 5px 0; font-size: 24px; }
        .tag { background: #ffebee; color: #c62828; padding: 5px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
        .info-label { font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; }
        .info-value { font-size: 16px; font-weight: 500; color: #333; }
        
        /* BUTONLAR */
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-call { background: #007bff; color: white; } /* Mavi */
        .btn-ai { background: #ffc107; color: black; } /* Sarı */
        .btn-yes { background: #dc3545; color: white; } /* Kırmızı */
        .btn-no { background: #28a745; color: white; } /* Yeşil */
        .btn-back { background: #6c757d; color: white; } /* Gri */

        .hidden { display: none; } /* Gizleme sınıfı */
        
        /* ACİL DURUM EKRANI STİLLERİ */
        .alert-box { padding: 20px; border-radius: 10px; margin-top: 20px; }
        .alert-red { background: #ffebee; border: 2px solid #c62828; color: #c62828; }
        .alert-green { background: #e8f5e9; border: 2px solid #2e7d32; color: #2e7d32; }
    </style>
</head>
<body>

    <div class="container" id="mainScreen">
        <div class="header" style="height: 60px;"></div>
        <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg" class="profile-img">
        
        <div class="content">
            <h1>AHMET YILMAZ</h1>
            <span class="tag">⚠️ EPİLEPSİ HASTASI</span>
            
            <div class="info-box">
                <div class="info-label">Kan Grubu</div>
                <div class="info-value">A Rh+</div>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                <div class="info-label">Alerjiler</div>
                <div class="info-value" style="color: red;">PENİSİLİN (ÖLÜMCÜL!)</div>
                <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                <div class="info-label">Kullandığı İlaçlar</div>
                <div class="info-value">Depakin 500mg, Keppra</div>
            </div>

            <button class="btn btn-call" onclick="window.location.href='tel:+905555555555'">📞 AİLEYİ ARA (Annesi)</button>
            <button class="btn btn-ai" onclick="startTriage()">🤖 YAPAY ZEKA İLK YARDIM</button>
        </div>
    </div>

    <div class="container hidden" id="triageScreen">
        <div class="header">ACİL DURUM ANALİZİ</div>
        <div class="content">
            <h2 id="questionText">Hastanın bilinci yerinde mi?</h2>
            <p>Soruları cevaplayarak doğru müdahaleyi öğrenin.</p>
            
            <div id="buttonsArea">
                </div>

            <button class="btn btn-back" onclick="resetApp()">Geri Dön</button>
        </div>
    </div>

    <div class="container hidden" id="resultScreen">
        <div class="header">YAPILMASI GEREKENLER</div>
        <div class="content">
            <div id="resultContent" class="alert-box">
                </div>
            <br>
            <button class="btn btn-call" onclick="window.location.href='tel:112'">🚑 112'Yİ ARA</button>
            <button class="btn btn-back" onclick="resetApp()">Başa Dön</button>
        </div>
    </div>

    <script>
        /* MANTIK KISMI (JAVASCRIPT) */
        
        function showScreen(screenId) {
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('triageScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function resetApp() {
            showScreen('mainScreen');
        }

        function startTriage() {
            showScreen('triageScreen');
            askQuestion(1);
        }

        function askQuestion(step) {
            const qText = document.getElementById('questionText');
            const btnArea = document.getElementById('buttonsArea');
            btnArea.innerHTML = ''; // Önceki butonları temizle

            if (step === 1) {
                qText.innerText = "Hasta şu an nöbet geçiriyor mu? (Titreme/Kasılma)";
                
                // EVET Butonu
                let btnYes = document.createElement('button');
                btnYes.className = 'btn btn-yes';
                btnYes.innerText = "EVET, KASILIYOR";
                btnYes.onclick = function() { showResult('nobet'); };
                
                // HAYIR Butonu
                let btnNo = document.createElement('button');
                btnNo.className = 'btn btn-no';
                btnNo.innerText = "HAYIR, DURDU / BAYGIN";
                btnNo.onclick = function() { askQuestion(2); }; // 2. Soruya git

                btnArea.appendChild(btnYes);
                btnArea.appendChild(btnNo);
            } 
            else if (step === 2) {
                qText.innerText = "Hastanın bilinci açık mı? (Size tepki veriyor mu?)";
                
                let btnYes = document.createElement('button');
                btnYes.className = 'btn btn-no'; // Yeşil renk (İyi durum)
                btnYes.innerText = "EVET, KONUŞUYOR";
                btnYes.onclick = function() { showResult('iyi'); };

                let btnNo = document.createElement('button');
                btnNo.className = 'btn btn-yes'; // Kırmızı renk (Kötü durum)
                btnNo.innerText = "HAYIR, TEPKİ YOK";
                btnNo.onclick = function() { showResult('bilinc_kapali'); };

                btnArea.appendChild(btnYes);
                btnArea.appendChild(btnNo);
            }
        }

        function showResult(durum) {
            showScreen('resultScreen');
            const resBox = document.getElementById('resultContent');
            
            if (durum === 'nobet') {
                resBox.className = 'alert-box alert-red';
                resBox.innerHTML = "<h3>⚠️ NÖBET GEÇİRİYOR</h3><ul><li>Sakin olun, saati kontrol edin.</li><li>Başının altına yumuşak bir şey (ceket) koyun.</li><li>Etraftaki sert cisimleri uzaklaştırın.</li><li><b>ASLA ağzını açmaya çalışmayın!</b></li></ul>";
            } else if (durum === 'bilinc_kapali') {
                resBox.className = 'alert-box alert-red';
                resBox.innerHTML = "<h3>⚠️ BİLİNÇ KAPALI</h3><ul><li>Hastayı derhal <b>YAN ÇEVİRİN</b> (Koma Pozisyonu).</li><li>Nefes alıp almadığını kontrol edin.</li><li>Hemen 112'yi arayın.</li><li>Başından ayrılmayın.</li></ul>";
            } else if (durum === 'iyi') {
                resBox.className = 'alert-box alert-green';
                resBox.innerHTML = "<h3>✅ DURUM STABİL</h3><ul><li>Hastayı yormayın.</li><li>Su içmesi için zorlamayın.</li><li>Kendine gelmesini bekleyin.</li><li>Ailesine haber verin.</li></ul>";
            }
        }
    </script>

</body>
</html>
